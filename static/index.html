<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1a2b; --accent:#8a7fb8; --bg:#ece9f5; --card:rgba(255,255,255,.62);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);
  background:color-mix(in srgb,var(--accent) 14%,#fff);
  transition:background .9s var(--ease);overflow-x:hidden;
}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;background:var(--accent);
  transition:background .9s var(--ease);animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-14vmax}
.bg i:nth-child(2){width:34vmax;height:34vmax;right:-10vmax;bottom:-12vmax;animation-delay:-6s;opacity:.35}
.bg i:nth-child(3){width:22vmax;height:22vmax;left:42%;top:55%;animation-delay:-11s;opacity:.25}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.15)}}

main{position:relative;z-index:1;min-height:100%;max-width:1120px;margin:0 auto;padding:clamp(24px,5vw,64px);
  display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,5vw,72px);align-items:center}
h1{font-size:clamp(2.6rem,6vw,4.6rem);line-height:.96;font-weight:800;letter-spacing:-.035em;font-variation-settings:"opsz" 96}
.lead{margin:18px 0 28px;max-width:34ch;font-size:1.08rem;line-height:1.5;opacity:.72}

.field{position:relative;background:var(--card);backdrop-filter:blur(14px);border:1.5px solid rgba(255,255,255,.9);
  border-radius:22px;padding:6px;box-shadow:0 18px 50px -24px color-mix(in srgb,var(--accent) 70%,#000);
  transition:box-shadow .4s,transform .4s var(--ease)}
.field:focus-within{transform:translateY(-2px);box-shadow:0 28px 60px -24px color-mix(in srgb,var(--accent) 90%,#000),0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
textarea{width:100%;height:132px;border:0;background:transparent;resize:none;outline:0;padding:16px 18px 4px;
  font:inherit;font-size:1.12rem;line-height:1.5;color:var(--ink)}
textarea::placeholder{color:rgba(28,26,43,.38)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 8px 18px;font-size:.82rem;opacity:.9}
.count{opacity:.5;font-variant-numeric:tabular-nums}
button.go{position:relative;overflow:hidden;border:0;cursor:pointer;font:inherit;font-weight:600;color:#fff;
  background:color-mix(in srgb,var(--accent) 80%,#000 20%);padding:12px 22px;border-radius:14px;
  transition:transform .25s var(--ease),background .9s,box-shadow .3s;box-shadow:0 10px 24px -10px var(--accent)}
button.go:hover:not(:disabled){transform:translateY(-2px) scale(1.03)}
button.go:active:not(:disabled){transform:scale(.97)}
button.go:disabled{opacity:.5;cursor:not-allowed}
button.go .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{border:1.5px solid color-mix(in srgb,var(--ink) 14%,transparent);background:rgba(255,255,255,.4);color:inherit;
  font:inherit;font-size:.86rem;padding:8px 14px;border-radius:99px;cursor:pointer;transition:all .25s var(--ease)}
.chip:hover{background:#fff;transform:translateY(-2px) rotate(-1deg);border-color:var(--accent)}
.err{margin-top:14px;font-size:.9rem;color:#b3261e;min-height:1.2em}

.stage{display:flex;flex-direction:column;align-items:center;gap:22px}
.orbwrap{position:relative;width:min(340px,70vw);aspect-ratio:1;display:grid;place-items:center;
  transform:translate(var(--px,0),var(--py,0));transition:transform .25s ease-out}
.orb{position:absolute;inset:0;border-radius:42% 58% 55% 45%/48% 42% 58% 52%;
  background:radial-gradient(circle at 32% 28%,#fff 0,color-mix(in srgb,var(--accent) 55%,#fff) 28%,var(--accent) 70%,color-mix(in srgb,var(--accent) 70%,#000) 100%);
  box-shadow:0 40px 80px -30px var(--accent),inset -14px -20px 40px rgba(0,0,0,.12);
  animation:morph 9s ease-in-out infinite;transition:background .9s,box-shadow .9s,scale .3s var(--ease)}
.orb.typing{animation-duration:2.4s;scale:1.04}
.orb.think{animation-duration:1.1s}
.orb.pop{animation:morph 9s ease-in-out infinite,pop .7s var(--ease)}
@keyframes morph{0%,100%{border-radius:42% 58% 55% 45%/48% 42% 58% 52%}
  33%{border-radius:58% 42% 40% 60%/55% 58% 42% 45%}66%{border-radius:48% 52% 62% 38%/40% 50% 50% 60%}}
@keyframes pop{0%{transform:scale(.88)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
.emoji{position:relative;font-size:clamp(4rem,12vw,6.2rem);line-height:1;filter:drop-shadow(0 8px 14px rgba(0,0,0,.2));
  transition:transform .5s var(--ease),opacity .3s}
.emoji.swap{animation:emo .6s var(--ease)}
@keyframes emo{0%{transform:scale(.2) rotate(-30deg);opacity:0}70%{transform:scale(1.15) rotate(6deg)}100%{transform:none;opacity:1}}
.verdict{text-align:center;min-height:84px}
.verdict h2{font-size:2.1rem;font-weight:800;letter-spacing:-.02em;text-transform:capitalize}
.verdict p{opacity:.65;margin-top:2px;font-variant-numeric:tabular-nums}

.bars{width:100%;max-width:400px;display:grid;gap:9px}
.row{display:grid;grid-template-columns:24px 74px 1fr 46px;align-items:center;gap:10px;font-size:.88rem;opacity:.9}
.row.top{font-weight:600;opacity:1}
.track{height:10px;border-radius:9px;background:rgba(28,26,43,.08);overflow:hidden}
.fill{height:100%;width:0;border-radius:9px;background:var(--c);transition:width 1s var(--ease)}
.row span:last-child{text-align:right;font-variant-numeric:tabular-nums}

@media(max-width:860px){main{grid-template-columns:1fr}.lead{max-width:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <section>
    <h1>How does that sentence feel?</h1>
    <p class="lead">Write anything. A neural network reads it and tells you which of six emotions it carries.</p>
    <div class="field">
      <textarea id="txt" maxlength="2000" placeholder="I can't believe they remembered my birthday…" aria-label="Sentence to analyze"></textarea>
      <div class="bar"><span class="count" id="count">0 / 2000</span>
        <button class="go" id="go" disabled>Read the mood</button></div>
    </div>
    <p class="err" id="err" role="alert"></p>
    <div class="chips" id="chips"></div>
  </section>

  <section class="stage" aria-live="polite">
    <div class="orbwrap" id="wrap"><div class="orb" id="orb"></div><div class="emoji" id="emoji">🫧</div></div>
    <div class="verdict"><h2 id="label">Waiting for words</h2><p id="conf">Type a sentence to begin</p></div>
    <div class="bars" id="bars"></div>
  </section>
</main>

<script>
const EMO = {
  sadness:{e:"😢",c:"#4f7cff"}, joy:{e:"😄",c:"#f5a400"}, love:{e:"❤️",c:"#f0457b"},
  anger:{e:"😠",c:"#e5392f"}, fear:{e:"😨",c:"#7b4fd6"}, surprise:{e:"😲",c:"#10b5a0"}
};
const SAMPLES = [
  "I miss how things used to be",
  "We just got the keys to our first home!",
  "How dare you talk to me like that",
  "Something is moving in the dark outside",
  "I never expected to win anything today",
  "You make every ordinary day feel special"
];
const $ = id => document.getElementById(id);
const txt=$("txt"), go=$("go"), orb=$("orb"), emoji=$("emoji"), err=$("err");
const root=document.documentElement.style;

// build bars + chips
$("bars").innerHTML = Object.entries(EMO).map(([k,v])=>
  `<div class="row" id="r-${k}" style="--c:${v.c}"><span>${v.e}</span><span style="text-transform:capitalize">${k}</span>
   <div class="track"><div class="fill"></div></div><span>0%</span></div>`).join("");
$("chips").innerHTML = SAMPLES.map(s=>`<button class="chip" type="button">${s}</button>`).join("");
$("chips").addEventListener("click",e=>{
  if(!e.target.classList.contains("chip"))return;
  typeInto(e.target.textContent);
});

// typewriter fill for samples
let typer;
function typeInto(s){
  clearInterval(typer); txt.value=""; let i=0;
  typer=setInterval(()=>{ txt.value=s.slice(0,++i); onInput(); if(i>=s.length){clearInterval(typer);analyze();} },22);
}

// input handling + orb wobble while typing
let idle;
function onInput(){
  $("count").textContent = `${txt.value.length} / 2000`;
  go.disabled = !txt.value.trim();
  orb.classList.add("typing"); clearTimeout(idle);
  idle=setTimeout(()=>orb.classList.remove("typing"),600);
}
txt.addEventListener("input",()=>{clearInterval(typer);onInput()});
txt.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.key==="Enter") analyze(); });
go.addEventListener("click",e=>{
  const r=document.createElement("span"),b=go.getBoundingClientRect(),d=Math.max(b.width,b.height);
  r.className="rip"; r.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-b.left-d/2}px;top:${e.clientY-b.top-d/2}px`;
  go.appendChild(r); setTimeout(()=>r.remove(),600); analyze();
});

// orb parallax
addEventListener("pointermove",e=>{
  const x=(e.clientX/innerWidth-.5)*22, y=(e.clientY/innerHeight-.5)*22;
  $("wrap").style.setProperty("--px",x+"px"); $("wrap").style.setProperty("--py",y+"px");
});

function countUp(el,to,ms=900){
  const t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/ms),v=to*(1-Math.pow(1-p,3));
    el.textContent=v.toFixed(1)+"%"; if(p<1)requestAnimationFrame(f)})(t0);
}

let busy=false;
async function analyze(){
  const text=txt.value.trim();
  if(!text||busy)return;
  busy=true; go.disabled=true; err.textContent="";
  orb.classList.add("think"); $("label").textContent="Reading…"; $("conf").textContent="Thinking it through";
  try{
    const res=await fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
    if(!res.ok){
      const j=await res.json().catch(()=>({}));
      throw new Error(res.status===503?"The model is still waking up. Try again in a few seconds.":
        (typeof j.detail==="string"?j.detail:"Something went wrong. Check your text and try again."));
    }
    show(await res.json());
  }catch(ex){
    err.textContent = ex.message==="Failed to fetch" ? "Can't reach the server. Check your connection." : ex.message;
    $("label").textContent="No reading"; $("conf").textContent="Try again";
  }finally{
    orb.classList.remove("think"); busy=false; go.disabled=!txt.value.trim();
  }
}

function show(d){
  const k=d.predicted_emotion, m=EMO[k];
  root.setProperty("--accent",m.c);
  emoji.classList.remove("swap"); void emoji.offsetWidth; emoji.textContent=m.e; emoji.classList.add("swap");
  orb.classList.remove("pop"); void orb.offsetWidth; orb.classList.add("pop");
  $("label").textContent=k;
  $("conf").textContent=""; const c=document.createElement("span"); $("conf").append(c,document.createTextNode(" confident"));
  countUp(c,d.confidence*100);
  for(const [name,p] of Object.entries(d.all_probabilites)){
    const row=$("r-"+name); if(!row)continue;
    row.classList.toggle("top",name===k);
    row.querySelector(".fill").style.width=(p*100)+"%";
    countUp(row.lastElementChild,p*100);
  }
}
</script>
</body>
</html>
